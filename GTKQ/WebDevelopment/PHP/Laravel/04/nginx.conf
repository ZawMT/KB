# nginx config for the "web" container image.
# Baked into the image at /etc/nginx/conf.d/default.conf by the Dockerfile.
#
# Differences from the VPS config in lesson 03:
#
#   - fastcgi_pass targets "app:9000" — a TCP address resolved by Docker's DNS
#     to the app container — instead of a unix socket on the same machine.
#   - No server_name, no TLS. Terminating HTTPS is the job of whatever sits in
#     front (Caddy, Traefik, a cloud load balancer). Certificates do not belong
#     inside an application image.
#   - Logs go to stdout/stderr, which the base image already symlinks.

upstream php-fpm {
    # "app" is the compose service name. Docker's embedded DNS resolves it to
    # the container's IP, and re-resolves when the container is replaced.
    server app:9000;

    keepalive 16;
}

server {
    listen 80 default_server;

    root /var/www/html/public;

    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel's built-in health endpoint. Container orchestrators poll this to
    # decide whether the container is ready for traffic. Kept out of the access
    # log because it is hit every few seconds.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        # SCRIPT_FILENAME must be the path as the APP container sees it. Both
        # images use /var/www/html, so the two agree — a mismatch here is the
        # usual cause of "Primary script unknown" / File not found.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;

        # Required for upstream keepalive to work.
        fastcgi_keep_conn on;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Container convention: logs are a stream on stdout/stderr, collected by
    # the platform. Never a file inside the container — it would grow unbounded
    # and vanish on restart.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}

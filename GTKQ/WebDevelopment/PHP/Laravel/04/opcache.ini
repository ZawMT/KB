; Production OPcache settings for a containerised Laravel app.
; Installed to /usr/local/etc/php/conf.d/99-opcache.ini by the Dockerfile.
;
; OPcache stores compiled PHP bytecode in shared memory, so the interpreter
; does not re-parse every file on every request. On a framework the size of
; Laravel this is a large difference, not a micro-optimisation.

opcache.enable=1
opcache.enable_cli=0

; Shared memory for compiled bytecode. 128M is comfortable for Laravel plus a
; typical vendor tree.
opcache.memory_consumption=256

; Interned strings buffer — class and function names, shared across requests.
opcache.interned_strings_buffer=16

; Must exceed the number of PHP files in the project INCLUDING vendor/.
; Laravel plus dependencies is commonly 10-15k files. If this is too low,
; OPcache silently stops caching the overflow and performance quietly drops.
; Check the real number with:  find . -type f -name '*.php' | wc -l
opcache.max_accelerated_files=20000

; The important one for containers.
;
; Normally OPcache stat()s each file on every request to see if it changed.
; In an immutable image the code CANNOT change — a new version means a new
; image and a new container — so those syscalls are pure waste. Turning this
; off removes them.
;
; The consequence, which is really the point of the whole approach: editing a
; file inside a running container has no effect whatsoever. Deploying means
; replacing the container. This setting would be actively wrong in the
; development setup of lesson 02, where files are bind-mounted and edited live.
opcache.validate_timestamps=0

; Do not waste memory storing comments — except that annotation-based packages
; read docblocks at runtime, so leaving these enabled is the safe default.
opcache.save_comments=1

; Fast shutdown sequence for request teardown.
opcache.fast_shutdown=1

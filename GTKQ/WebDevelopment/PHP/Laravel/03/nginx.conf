# nginx server block for a Laravel app.
# Install on the server as /etc/nginx/sites-available/myapp, then:
#   sudo ln -s /etc/nginx/sites-available/myapp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Edit: server_name, root, and the php8.4-fpm socket to match your PHP version.
# Certbot rewrites this file to add the TLS listener and the HTTP->HTTPS
# redirect, so set it up over plain HTTP first and let certbot take it from there.

server {
    listen 80;
    listen [::]:80;

    server_name example.com www.example.com;

    # The document root is the project's public/ directory — NOT the project
    # root. Everything above public/ (.env, storage/, vendor/) must stay
    # unreachable over HTTP.
    root /var/www/myapp/public;

    index index.php;
    charset utf-8;

    # Uploads. Laravel's own validation should match this.
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The front-controller rule: serve the file if it exists, otherwise hand
    # the URL to index.php and let Laravel's router deal with it. Without this
    # line every route except / returns 404.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Hand .php requests to PHP-FPM over its unix socket.
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;

        # $realpath_root rather than $document_root, so symlinked release
        # directories (see the zero-downtime section) resolve correctly.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Cache static assets aggressively. Vite fingerprints filenames, so a
    # long max-age is safe for anything it builds into /build.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block dotfiles (.env, .git, ...) while still allowing /.well-known,
    # which certbot needs for domain validation.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    access_log /var/log/nginx/myapp-access.log;
    error_log  /var/log/nginx/myapp-error.log;
}

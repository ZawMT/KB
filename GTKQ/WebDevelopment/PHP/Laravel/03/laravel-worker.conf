; Supervisor program definition for Laravel queue workers.
; Install on the server as /etc/supervisor/conf.d/myapp-worker.conf, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status
;
; queue:work is a long-running process that exits on failure, on memory limits,
; and on `php artisan queue:restart`. Supervisor's job is to always start it again.

[program:myapp-worker]

; With numprocs > 1 the process_name must be unique, hence %(process_num)02d.
process_name=%(program_name)s_%(process_num)02d

; queue:work (not queue:listen) — it boots the framework once and keeps it in
; memory, which is far faster but means new code needs queue:restart.
;   --sleep=3      seconds to wait when the queue is empty
;   --tries=3      attempts before a job is marked failed
;   --max-time=3600  recycle the worker hourly, so any memory leak is bounded
command=php /var/www/myapp/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600

directory=/var/www/myapp
autostart=true
autorestart=true

; Run as the deploy user, not root — matches file ownership on storage/.
user=deploy

; How many workers. Start at 2 and scale with queue depth, not optimism;
; each one is a full PHP process holding the framework in memory.
numprocs=2

redirect_stderr=true
stdout_logfile=/var/www/myapp/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Signal the whole process group, so a job that shelled out dies with it.
stopasgroup=true
killasgroup=true

; Give an in-flight job time to finish before SIGKILL. Should be at least as
; long as your slowest job, or deploys will kill work mid-flight.
stopwaitsecs=3600
